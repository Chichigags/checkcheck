<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckCheck Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      padding: 20px;
    }
    .poster {
      width: 405px;
      height: 720px;
      /* 9:16 phone ratio - scale up for high-res: 1080x1920 */
      background: linear-gradient(165deg, #e8e0f0 0%, #f5e6e0 50%, #f0e8e8 100%);
      border-radius: 24px;
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'DM Sans', -apple-system, sans-serif;
      color: #4a4a5a;
    }
    .headline {
      font-size: 28px;
      font-weight: 700;
      color: #5c4a6a;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .subhead {
      font-size: 18px;
      font-weight: 500;
      color: #6a5a70;
      margin-top: 8px;
    }
    .benefits {
      font-size: 15px;
      font-weight: 500;
      color: #6a5a70;
      line-height: 1.6;
    }
    .tagline {
      font-size: 16px;
      font-weight: 600;
      color: #5c4a6a;
      font-style: italic;
    }
    .cta {
      font-size: 14px;
      font-weight: 500;
      color: #6a5a70;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .footer-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: contain;
    }
    .footer-handle {
      font-size: 14px;
      font-weight: 600;
      color: #5c4a6a;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div>
      <div class="headline">CheckCheck</div>
      <div class="subhead">your fortune today</div>
      <div class="benefits" style="margin-top: 32px;">
        Lucky color. Lucky number. Today's vibe.<br>
        BaZi + astrology, personalized to you.
      </div>
      <div class="benefits" style="margin-top: 20px;">
        One message. That's it. No scroll. No clutter.
      </div>
      <div class="tagline" style="margin-top: 28px;">No harm in checking.</div>
      <div class="cta" style="margin-top: 16px;">Get your daily drop on Telegram</div>
    </div>
    <div class="footer">
      <img src="checkcheck-logo.png" alt="CheckCheck" class="footer-logo">
      <span class="footer-handle">@CheckCheck_daily_bot</span>
    </div>
  </div>
</body>
</html>
